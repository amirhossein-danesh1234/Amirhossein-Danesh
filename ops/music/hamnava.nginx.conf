map $host $hamnava_index {
    default /music/index.html;
    music-admin.amirhossein-danesh.ir /music-admin/index.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name music.amirhossein-danesh.ir music-admin.amirhossein-danesh.ir;
    root /var/www/amirhossein-danesh.ir/current;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;

    location = / {
        try_files $hamnava_index =404;
    }

    location = /api/owner/upload {
        if ($host != music-admin.amirhossein-danesh.ir) { return 404; }
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
    }

    location ^~ /api/ {
        client_max_body_size 96k;
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
    }

    location ^~ /_astro/ { try_files $uri =404; }
    location ^~ /fonts/ { try_files $uri =404; }
    location = /brand/hamnava-logo.png { try_files $uri =404; }
    location = /brand/hamnava-icon-round.svg { try_files $uri =404; }
    location / {
        if ($host = music-admin.amirhossein-danesh.ir) { return 404; }
        proxy_pass http://127.0.0.1:3102;
        proxy_set_header Host $host;
    }
}
